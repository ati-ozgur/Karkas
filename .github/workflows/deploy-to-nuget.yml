name: deploy-to-nuget

on:
  workflow_dispatch:
  push:
    paths:
      - 'version.txt'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # NuGet Trusted Publishing: GitHub OIDC token is exchanged for a temporary (1 hour) API key
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # SDK 11 builds every target (net8.0-net11.0) of the multi-targeted packages
        dotnet-version: |
          10.0.x
          11.0.x
    - name: NuGet login (OIDC → temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        # nuget.org profile name (public, shown as package owner). Publishing is authorized by the
        # Trusted Publishing policy on nuget.org for this repository and the workflow file deploy-to-nuget.yml
        user: atilla_ozgur
    - name: deploy nuget bash
      shell: bash
      run: ./deploy_nuget_packages.bash
      env:
        KARKAS_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}




