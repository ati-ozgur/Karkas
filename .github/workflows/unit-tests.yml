name: unit-tests

# Runs the xUnit tests in Karkas.Tests once per target framework (net10.0 and net11.0).
on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # 10.0.x provides the .NET 10 runtime for the net10.0 run, 11.0.x builds and runs net11.0
        dotnet-version: |
          10.0.x
          11.0.x
    - name: dotnet test Karkas.Tests
      run: dotnet test Karkas.Tests
