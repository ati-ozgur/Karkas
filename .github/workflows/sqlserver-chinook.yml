name: sqlserver-chinook

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["sqlite-chinook"]
    branches: [master]
    types: 
      - completed

jobs:
  build:
    name: build (${{ matrix.framework }})
    # workflow_run fires on success and failure alike: only continue the chain after success
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0, net11.0]
    runs-on: ubuntu-24.04
    env:
      # e2e scripts build the generated test project for this target framework
      KARKAS_TEST_FRAMEWORK: ${{ matrix.framework }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
    - name: code generate for chinook SQL Server database and run simple tests
      run: ./Karkas.Examples/TestBash/run_sqlserver_chinook_auto_increment.bash
